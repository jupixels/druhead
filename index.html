<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drunkhead</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rye&family=Alegreya+Sans+SC:wght@700;900&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #0d0905; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  #game {
    image-rendering: auto;
    background: #000;
    box-shadow: 0 0 60px #000;
    filter: sepia(0.22) contrast(1.06) saturate(1.08);
    transition: filter .4s;
  }
  #game.bw { filter: grayscale(1) contrast(1.25) brightness(1.02); }
  #game.nofilter { filter: none; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720"></canvas>
<script src="lib/sfx.js"></script>
<script type="module" src="src/main.js"></script>
</body>
</html>
